name: 블로그 화제 재료 모으기
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국 시간 06:00
  workflow_dispatch:        # GitHub에서 '지금 실행' 버튼
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "화제 재료 $(date +%F)"
          git push
